# cliamp — Catppuccin Frappé, same theme file as macos-dot-files
theme = "catppuccin-frappe"

# Winamp-style bars with floating peak caps
visualizer = "ClassicPeak"

# File browser ('o') starts here
initial_directory = "~/Music"

[ytmusic]
enabled      = true
cookies_from = "chromium"

[mixcloud]
enabled = true
cookies_from = "chromium"
max_items = 100
stream_creators = 20
