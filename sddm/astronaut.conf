# SDDM config for sddm-astronaut-theme.
# Installed as /etc/sddm.conf.d/astronaut.conf

[General]
# On-screen keyboard support (recommended by the theme author)
InputMethod=qtvirtualkeyboard
# 4K screen: render the login screen at 2x so it isn't tiny.
# The theme is laid out for 1920x1080, which is exactly 3840x2160 / 2.
GreeterEnvironment=QT_SCREEN_SCALE_FACTORS=2

[Theme]
Current=sddm-astronaut-theme
# Catppuccin Frappé Breeze cursor. SDDM can't read ~, so install-cursor.sh copies
# the theme from ~/.local/share/icons to /usr/share/icons.
CursorTheme=catppuccin-frappe-breeze-cursors
# 48 = 24 doubled: the 2x scale above makes the greeter bigger but not its cursor.
CursorSize=48
