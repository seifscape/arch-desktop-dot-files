# Night tint (blue-light filter). hyprsunset reads this file by itself.
# Warm from 10 pm, back to normal colour at 7 am. Change the times or the Kelvin value here.
# Lower temperature = warmer (6500 is "normal" daylight). The switch is instant, not gradual.
# Super+Shift+N turns it on/off by hand (see hyprwizrd.lua).

profile {
    time = 7:00
    identity = true
}

profile {
    time = 22:00
    temperature = 4000
}
