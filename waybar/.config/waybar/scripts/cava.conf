# Tiny visualizer for the waybar custom/cava module (see cava.sh). Separate from ~/.config/cava,
# which styles the full-size Super+A window.
[general]
bars = 12
framerate = 30

[input]
# pulse sees the Bluetooth sink; the autodetected pipewire input read silence over AirPods
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
